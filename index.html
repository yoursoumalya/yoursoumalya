<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ѕσυмαℓуα мαи∂αℓ</title>

<!-- Elegant Unicode-friendly fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@300;400&family=Noto+Sans+Symbols+2&display=swap"
      rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* =========================================
   DARK FOSSILS-STYLE INTRO BACKGROUND
   ========================================= */

body {
    background: #090909;
}

.intro {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #151515 0%,
            #0d0d0d 45%,
            #080808 100%
        );

    z-index: 9999;

    animation:
        introOut 1s ease-in-out 4.2s forwards;
}


/* =========================================
   ARTIST NAME
   ========================================= */

.name {
    position: relative;

    font-family:
        "Noto Serif",
        "Noto Sans Symbols 2",
        "Noto Sans",
        serif;

    font-size: clamp(2.2rem, 7vw, 6.2rem);

    font-weight: 300;

    letter-spacing: 0.045em;

    color: #e8e8e8;

    white-space: nowrap;

    /*
       Important:
       The shine is clipped inside the text area.
    */
    overflow: hidden;

    animation:
        textAppear 1.5s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* =========================================
   SHINE — ONLY INSIDE THE LETTERS
   ========================================= */

.name::after {

    content: "";

    position: absolute;

    top: -25%;
    left: -45%;

    width: 28%;
    height: 150%;

    background:
        linear-gradient(
            105deg,
            transparent 0%,
            rgba(255,255,255,0.04) 20%,
            rgba(255,255,255,0.35) 40%,
            rgba(255,255,255,0.95) 50%,
            rgba(255,255,255,0.35) 60%,
            rgba(255,255,255,0.04) 80%,
            transparent 100%
        );

    transform: skewX(-18deg);

    /*
       Prevent shine from spreading
       outside the letters.
    */
    mix-blend-mode: screen;

    pointer-events: none;

    animation:
        shine 1.8s
        cubic-bezier(.4,0,.2,1)
        1.25s
        forwards;
}


/* =========================================
   TEXT APPEAR
   ========================================= */

@keyframes textAppear {

    0% {
        opacity: 0;

        transform:
            scale(0.94);

        letter-spacing: 0.16em;

        filter: blur(8px);
    }

    55% {
        opacity: 1;

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);

        letter-spacing: 0.045em;

        filter: blur(0);
    }
}


/* =========================================
   LIGHT MOVES LEFT → RIGHT
   ========================================= */

@keyframes shine {

    0% {
        left: -45%;
    }

    100% {
        left: 125%;
    }
}


/* =========================================
   INTRO FADES OUT
   ========================================= */

@keyframes introOut {

    0% {
        opacity: 1;

        visibility: visible;
    }

    100% {
        opacity: 0;

        visibility: hidden;

        pointer-events: none;
    }
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

    .name {
        font-size: clamp(
            1.8rem,
            9.5vw,
            4rem
        );

        letter-spacing: 0.035em;
    }
}

</style>
</head>


<body>

<div class="intro">

    <div class="name">
        ѕσυмαℓуα мαи∂αℓ
    </div>

</div>

</body>
</html>
