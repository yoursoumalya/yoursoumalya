<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ѕσυмαℓуα мαn∂αℓ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#090909;
    font-family:"Noto Serif",serif;
}


/* ================================
   MAIN WEBSITE BACKGROUND
================================ */

.site{
    position:relative;
    min-height:100vh;
    width:100%;
    background-color:#090909;

    background-image:url("ddd.jpg");
    background-repeat:no-repeat;
    background-position:center top;
    background-size:100% auto;
}


/* Mobile background */

@media(max-width:600px){

    .site{
        background-image:url("ggg.jpg");
        background-size:100% auto;
        background-position:center top;
    }

}


/* ================================
   TOP LEFT ARTIST NAME
================================ */

.site-name{
    position:fixed;
    top:28px;
    left:32px;

    z-index:100;

    font-family:"Noto Serif",serif;
    font-size:clamp(1.2rem,2.2vw,2rem);
    font-weight:300;

    letter-spacing:.045em;
    color:#e7e7e7;

    white-space:nowrap;

    text-shadow:
        0 1px 8px rgba(0,0,0,.45);
}


@media(max-width:600px){

    .site-name{
        top:20px;
        left:20px;
        font-size:1.15rem;
    }

}


/* ================================
   INTRO
================================ */

.intro{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #101010 42%,
            #090909 78%,
            #070707 100%
        );

    z-index:9999;

    animation:introOut 1s ease-in-out 2s forwards;
}


.name{
    position:relative;
    display:inline-block;

    font-family:"Noto Serif",serif;

    font-size:clamp(2.2rem,7vw,6.2rem);

    font-weight:300;
    letter-spacing:.045em;

    color:#e7e7e7;

    white-space:nowrap;

    animation:textAppear .9s cubic-bezier(.22,1,.36,1) forwards;
}


/* Main cinematic shine */

.name::after{
    content:"ѕσυмαℓуα мαn∂αℓ";

    position:absolute;
    inset:0;

    pointer-events:none;

    color:transparent;
    -webkit-text-fill-color:transparent;

    -webkit-background-clip:text;
    background-clip:text;

    background-image:
        linear-gradient(
            105deg,
            transparent 0%,
            transparent 38%,
            rgba(255,255,255,.02) 42%,
            rgba(255,255,255,.20) 45%,
            rgba(255,255,255,.72) 48%,
            rgba(255,255,255,1) 50%,
            rgba(255,255,255,.72) 52%,
            rgba(255,255,255,.20) 55%,
            rgba(255,255,255,.02) 58%,
            transparent 62%,
            transparent 100%
        );

    background-size:260% 100%;
    background-position:130% 0;

    filter:drop-shadow(
        0 0 7px rgba(255,255,255,.32)
    );

    opacity:0;

    animation:
        premiumShine 1.2s cubic-bezier(.35,0,.2,1) .7s forwards;
}


/* Soft reflection */

.name::before{
    content:"ѕσυмαℓуα мαn∂αℓ";

    position:absolute;
    inset:0;

    pointer-events:none;

    color:transparent;
    -webkit-text-fill-color:transparent;

    -webkit-background-clip:text;
    background-clip:text;

    background-image:
        linear-gradient(
            105deg,
            transparent 43%,
            rgba(255,255,255,.08) 47%,
            rgba(255,255,255,.25) 50%,
            rgba(255,255,255,.08) 53%,
            transparent 57%
        );

    background-size:250% 100%;
    background-position:130% 0;

    opacity:0;

    animation:
        softReflection 1.2s cubic-bezier(.35,0,.2,1) .7s forwards;
}


/* ================================
   INTRO ANIMATIONS
================================ */

@keyframes textAppear{

    0%{
        opacity:0;
        transform:scale(.94);
        letter-spacing:.16em;
        filter:blur(8px);
    }

    55%{
        opacity:1;
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:scale(1);
        letter-spacing:.045em;
        filter:blur(0);
    }
}


@keyframes premiumShine{

    0%{
        opacity:0;
        background-position:135% 0;
    }

    12%{
        opacity:.9;
    }

    25%{
        opacity:1;
    }

    50%{
        opacity:1;
    }

    72%{
        opacity:.95;
    }

    88%{
        opacity:.35;
    }

    100%{
        opacity:0;
        background-position:-135% 0;
    }
}


@keyframes softReflection{

    0%{
        opacity:0;
        background-position:135% 0;
    }

    20%{
        opacity:.5;
    }

    50%{
        opacity:.75;
    }

    80%{
        opacity:.35;
    }

    100%{
        opacity:0;
        background-position:-135% 0;
    }
}


@keyframes introOut{

    0%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


/* Mobile intro */

@media(max-width:600px){

    .name{
        font-size:clamp(1.8rem,9.5vw,4rem);
        letter-spacing:.035em;
    }

}

</style>
</head>


<body>

<!-- Main Website -->

<div class="site">

    <!-- Artist Name -->
    <div class="site-name">
        ѕσυмαℓуα мαn∂αℓ
    </div>

</div>


<!-- Intro -->

<div class="intro">

    <div class="name">
        ѕσυмαℓуα мαn∂αℓ
    </div>

</div>

</body>
</html>
