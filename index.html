<script>

/* =================================
   MOBILE SCROLL STORY
================================= */

const mobileAbout =
    document.getElementById("mobileAbout");

const passages = [

    document.getElementById("passage1"),

    document.getElementById("passage2"),

    document.getElementById("passage3"),

    document.getElementById("passage4")

];


let shownStage = -1;
let targetStage = -1;
let stageChanging = false;


function getTargetStage(){

    const scrollY = window.scrollY;


    if(scrollY < 80){

        return -1;

    }


    if(scrollY < 300){

        return 0;

    }


    if(scrollY < 700){

        return 1;

    }


    if(scrollY < 1100){

        return 2;

    }


    if(scrollY < 1500){

        return 3;

    }


    return 4;

}


function showStage(stage){

    if(window.innerWidth > 600){

        return;

    }


    if(stage === -1){

        mobileAbout.classList.remove("show");

        passages.forEach(passage => {

            passage.classList.remove("active");

        });

        return;

    }


    mobileAbout.classList.add("show");


    if(stage === 0){

        passages.forEach(passage => {

            passage.classList.remove("active");

        });

        return;

    }


    passages.forEach((passage,index) => {

        passage.classList.toggle(

            "active",

            index === stage - 1

        );

    });

}


function processStage(){

    if(stageChanging){

        return;

    }


    if(shownStage === targetStage){

        return;

    }


    stageChanging = true;


    if(targetStage > shownStage){

        shownStage++;

    }
    else{

        shownStage--;

    }


    showStage(shownStage);


    setTimeout(() => {

        stageChanging = false;


        if(shownStage !== targetStage){

            processStage();

        }

    },1050);

}


function updateMobileAbout(){

    if(window.innerWidth > 600){

        return;

    }


    targetStage = getTargetStage();

    processStage();

}


window.addEventListener(

    "scroll",

    updateMobileAbout,

    {passive:true}

);


window.addEventListener(

    "resize",

    updateMobileAbout

);


showStage(-1);

</script>
