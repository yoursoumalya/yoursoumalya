<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ѕσυмαℓуα мαи∂αℓ</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #ffffff;
    }

    /* Full-screen intro */
    .intro {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(
            135deg,
            #ffffff 0%,
            #fdfefe 50%,
            #f8fbff 100%
        );

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 9999;

        animation: introOut 1s ease-in-out 4.2s forwards;
    }

    /* Artist name */
    .name {
        position: relative;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 7vw, 6.5rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        color: #171717;

        white-space: nowrap;

        /* Keeps the shine INSIDE the letters */
        overflow: hidden;

        animation:
            textAppear 1.4s cubic-bezier(.22,1,.36,1) forwards;
    }

    /*
       The moving light.
       It is clipped to the text itself, so it cannot
       spill onto the white background.
    */
    .name::after {
        content: "";
        position: absolute;
        top: -20%;
        left: -35%;
        width: 25%;
        height: 140%;

        background: linear-gradient(
            100deg,
            transparent 0%,
            rgba(255,255,255,0.15) 25%,
            rgba(255,255,255,0.95) 50%,
            rgba(255,255,255,0.15) 75%,
            transparent 100%
        );

        transform: skewX(-18deg);

        mix-blend-mode: screen;

        animation: shine 1.7s ease-in-out 1.3s forwards;
    }

    /* Text entering */
    @keyframes textAppear {
        0% {
            opacity: 0;
            transform: scale(0.94);
            letter-spacing: 0.16em;
            filter: blur(8px);
        }

        60% {
            opacity: 1;
            filter: blur(0);
        }

        100% {
            opacity: 1;
            transform: scale(1);
            letter-spacing: 0.04em;
            filter: blur(0);
        }
    }

    /* Light travelling left → right */
    @keyframes shine {
        0% {
            left: -35%;
        }

        100% {
            left: 120%;
        }
    }

    /* Intro leaving the screen */
    @keyframes introOut {
        0% {
            opacity: 1;
            visibility: visible;
        }

        100% {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    }

    /* Mobile */
    @media (max-width: 600px) {
        .name {
            font-size: clamp(2rem, 10vw, 4rem);
        }
    }
</style>
</head>

<body>

    <div class="intro">
        <div class="name">ѕσυмαℓуα мαи∂αℓ</div>
    </div>

</body>
</html>
