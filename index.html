<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ѕσυмαℓуα мαn∂αℓ</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@300;400&display=swap"
      rel="stylesheet">


<style>

/* =========================================
   RESET
   ========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================================
   BACKGROUND
   ========================================= */

body {
    background: #090909;
}


/* =========================================
   INTRO SCREEN
   ========================================= */

.intro {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #101010 42%,
            #090909 78%,
            #070707 100%
        );

    z-index: 9999;

    animation:
        introOut 1s ease-in-out 4.35s forwards;
}


/* =========================================
   ARTIST NAME
   ========================================= */

.name {

    position: relative;

    display: inline-block;

    font-family:
        "Noto Serif",
        serif;

    font-size:
        clamp(2.2rem, 7vw, 6.2rem);

    font-weight: 300;

    letter-spacing: 0.045em;

    color: #e7e7e7;

    white-space: nowrap;

    /*
       Keeps the animation elegant
       instead of looking oversized.
    */

    animation:
        textAppear
        1.45s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* =========================================
   PREMIUM SHINE LAYER
   ========================================= */

.name::after {

    content: "ѕσυмαℓуα мαn∂αℓ";

    position: absolute;

    inset: 0;

    pointer-events: none;

    /*
       The text itself is transparent.
       Only the gradient inside the glyphs
       becomes visible.
    */

    color: transparent;

    -webkit-text-fill-color: transparent;

    -webkit-background-clip: text;
    background-clip: text;

    background-image:

        linear-gradient(
            105deg,

            transparent 0%,

            transparent 38%,

            rgba(255,255,255,0.02) 42%,

            rgba(255,255,255,0.20) 45%,

            rgba(255,255,255,0.72) 48%,

            rgba(255,255,255,1.00) 50%,

            rgba(255,255,255,0.72) 52%,

            rgba(255,255,255,0.20) 55%,

            rgba(255,255,255,0.02) 58%,

            transparent 62%,

            transparent 100%
        );

    /*
       A large gradient is necessary
       for a smooth cinematic sweep.
    */

    background-size: 260% 100%;

    background-position: 130% 0;

    /*
       Slight optical glow inside
       the moving reflection.
    */

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,255,255,0.32)
        );

    opacity: 0;

    animation:
        premiumShine
        2.15s
        cubic-bezier(.35,0,.2,1)
        1.15s
        forwards;
}


/* =========================================
   VERY SUBTLE SECOND REFLECTION
   ========================================= */

.name::before {

    content: "ѕσυмαℓуα мαn∂αℓ";

    position: absolute;

    inset: 0;

    pointer-events: none;

    color: transparent;

    -webkit-text-fill-color: transparent;

    -webkit-background-clip: text;
    background-clip: text;

    background-image:

        linear-gradient(
            105deg,
            transparent 43%,
            rgba(255,255,255,0.08) 47%,
            rgba(255,255,255,0.25) 50%,
            rgba(255,255,255,0.08) 53%,
            transparent 57%
        );

    background-size: 250% 100%;

    background-position: 130% 0;

    opacity: 0;

    animation:
        softReflection
        2.15s
        cubic-bezier(.35,0,.2,1)
        1.15s
        forwards;
}


/* =========================================
   TEXT APPEAR
   ========================================= */

@keyframes textAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.94);

        letter-spacing:
            0.16em;

        filter:
            blur(8px);
    }

    55% {

        opacity: 1;

        filter:
            blur(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);

        letter-spacing:
            0.045em;

        filter:
            blur(0);
    }
}


/* =========================================
   MAIN CINEMATIC LIGHT
   ========================================= */

@keyframes premiumShine {

    0% {

        opacity: 0;

        background-position:
            135% 0;
    }

    12% {

        opacity: 0.9;
    }

    25% {

        opacity: 1;
    }

    50% {

        opacity: 1;
    }

    72% {

        opacity: 0.95;
    }

    88% {

        opacity: 0.35;
    }

    100% {

        opacity: 0;

        background-position:
            -135% 0;
    }
}


/* =========================================
   SOFT REFLECTION
   ========================================= */

@keyframes softReflection {

    0% {

        opacity: 0;

        background-position:
            135% 0;
    }

    20% {

        opacity: 0.5;
    }

    50% {

        opacity: 0.75;
    }

    80% {

        opacity: 0.35;
    }

    100% {

        opacity: 0;

        background-position:
            -135% 0;
    }
}


/* =========================================
   INTRO EXIT
   ========================================= */

@keyframes introOut {

    0% {

        opacity: 1;

        visibility: visible;
    }

    100% {

        opacity: 0;

        visibility: hidden;

        pointer-events: none;
    }
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

    .name {

        font-size:
            clamp(
                1.8rem,
                9.5vw,
                4rem
            );

        letter-spacing:
            0.035em;
    }
}

</style>

</head>


<body>


<div class="intro">

    <div class="name">
        ѕσυмαℓуα мαn∂αℓ
    </div>

</div>


</body>

</html>
